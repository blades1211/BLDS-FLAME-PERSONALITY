    const ALGORITHM_VERSION = '1.0.0';

    function calculateScores(answers) {
      const rawScores = {};
      TRAITS_CATALOG.forEach(t => { rawScores[t.id] = 0; });

      QUESTIONS_LIST.forEach(q => {
        const selectedOptId = answers[q.id];
        if (selectedOptId) {
          const opt = q.options.find(o => o.id === selectedOptId);
          if (opt && opt.scores) {
            Object.entries(opt.scores).forEach(([traitId, weight]) => {
              if (rawScores[traitId] !== undefined) {
                rawScores[traitId] += weight;
              }
            });
          }
        }
      });

      // Hitung max & min possible scores per trait untuk normalisasi akurat 0-100
      const maxScores = {};
      const minScores = {};
      TRAITS_CATALOG.forEach(t => {
        maxScores[t.id] = 0;
        minScores[t.id] = 0;
      });

      QUESTIONS_LIST.forEach(q => {
        const traitMax = {};
        const traitMin = {};
        q.options.forEach(opt => {
          if (opt.scores) {
            Object.entries(opt.scores).forEach(([traitId, w]) => {
              traitMax[traitId] = Math.max(traitMax[traitId] || 0, w);
              traitMin[traitId] = Math.min(traitMin[traitId] || 0, w);
            });
          }
        });
        Object.entries(traitMax).forEach(([tId, maxW]) => {
          if (maxScores[tId] !== undefined) maxScores[tId] += maxW;
        });
        Object.entries(traitMin).forEach(([tId, minW]) => {
          if (minScores[tId] !== undefined) minScores[tId] += minW;
        });
      });

      const percentages = {};
      TRAITS_CATALOG.forEach(t => {
        const raw = rawScores[t.id] || 0;
        const max = maxScores[t.id] || 1;
        const min = minScores[t.id] || 0;
        let pct = 0;
        if (max > min) {
          pct = 100 * (raw - min) / (max - min);
        }
        percentages[t.id] = Math.min(100, Math.max(0, Math.round(pct)));
      });

      return { rawScores, percentages };
    }

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-3 rounded-xl border text-xs font-medium shadow-lg backdrop-blur-md transition-all duration-300 transform translate-y-2 opacity-0 ${
        type === 'success' ? 'bg-darkSurface/90 border-gold/40 text-gold glow-box' :
        type === 'error' ? 'bg-darkSurface/90 border-crimson/40 text-crimson' :
        'bg-darkSurface/90 border-arcaneBlue/40 text-arcaneBlue'
      }`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

      if (!str) return '';
      return str.replace(/[&<>'"]/g,

                return `

                    onclick="window.selectTestOption(${currentQ.id}, '${opt.id}')"
                    class="w-full text-left p-4 rounded-xl border transition-all flex items-start gap-4 ${
                      isSelected
                        ? 'bg-gold/15 border-gold text-brightGold glow-box'
                        : 'bg-obsidian/60 border-gold/15 text-secondaryText hover:border-gold/40 hover:text-primaryText'
                    }"
                  >
                    <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold shrink-0 border ${
                      isSelected ? 'bg-gold text-obsidian border-gold' : 'border-gold/30 text-gold'
                    }">
                      ${opt.id}
                    </span>
                    <span class="text-sm pt-0.5">${escapeHTML(opt.text)}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Navigation Footer -->
          <div class="w-full flex items-center justify-between">

              onclick="window.prevTestQuestion()"
              ${currentTestIndex === 0 ? 'disabled' : ''}
              class="px-5 py-2.5 rounded-xl border text-xs font-semibold flex items-center gap-2 transition-all ${
                currentTestIndex === 0 ? 'opacity-40 border-white/10 text-mutedText cursor-not-allowed' : 'border-gold/30 text-gold hover:bg-gold/10'
              }"
            >
              <span>Sebelumnya</span>
            </button>

            ${currentTestIndex < totalQ - 1 ? `
              <button
                onclick="window.nextTestQuestion()"
                ${!selectedOpt ? 'disabled' : ''}
                class="px-6 py-2.5 rounded-xl text-xs font-cinzel font-bold flex items-center gap-2 transition-all glow-btn ${
                  !selectedOpt ? 'bg-white/10 text-mutedText cursor-not-allowed' : 'bg-gold text-obsidian hover:bg-brightGold'

        appDiv.innerHTML = renderTestPage();

    window.prevTestQuestion = function() {
      if (currentTestIndex > 0) {

      `;

    window.jumpToQuestion = function(idx) {
      currentTestIndex = idx;
      window.location.hash = '#/test';
    };

    window.submitTestResult = async function() {
      if (!testParticipant) return;
      const { rawScores, percentages } = calculateScores(userAnswers);

      const resultId = 'res_' + Math.random().toString(36).substring(2, 12);
      const participantResult = {
        id: resultId,
        participantId: testParticipant.id,
        name: testParticipant.name,
        createdAt: testParticipant.createdAt,
        completedAt: Date.now(),
        status: 'completed',
        questionSetVersion: QUESTION_SET_VERSION,
        algorithmVersion: ALGORITHM_VERSION,
        answers: userAnswers,
        rawScores,
        percentages
      };

      // Simpan ke localStorage dulu sebagai fallback andalan
      localStorage.setItem(`blds_result_${resultId}`, JSON.stringify(participantResult));

      // Coba simpan ke Firebase Realtime Database jika terinisialisasi
      if (isFirebaseInitialized && db) {
        try {
          await set(ref(db, `participants/${resultId}`), participantResult);
          showToast('Profil berhasil disimpan ke arsip rahasia BLDS!', 'success');
        } catch (e) {
          console.error("Gagal simpan ke Firebase:", e);
          showToast('Gagal terhubung ke Firebase, hasil tersimpan di mode lokal.', 'error');
        }
      } else {
        showToast('Hasil berhasil dihitung (Mode Demo/Lokal).', 'success');
      }

      window.location.hash = `#/result/${resultId}`;
    };

                </h2>

                    const pct = resultData.percentages[shadow.id] || 0;
                    return `
                      <div class="bg-darkSurface/60 border border-crimson/20 rounded-2xl p-6 flex flex-col justify-between">
                        <div>
                          <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-cinzel font-bold text-crimson tracking-widest">${escapeHTML(shadow.nameEn)}</span>

                          <div class="w-full h-2 bg-obsidian rounded-full overflow-hidden border border-crimson/20 mb-3">
                            <div class="h-full bg-crimson transition-all duration-500" style="width: ${pct}%"></div>

    window.copyResultSummary = function(resultId) {
      const local = localStorage.getItem(`blds_result_${resultId}`);
      if (!local) return;
      const data = JSON.parse(local);
      const text = `Profil BLDS Flames - ${data.name}\nTanggal: ${new Date(data.completedAt).toLocaleDateString()}\nJelajahi arsip kepribadian BLACKLIGHTDOMINIONS.`;
      navigator.clipboard.writeText(text);
      showToast('Ringkasan profil berhasil disalin!', 'success');
    };

    window.handleAdminLogin = async function(e) {
      e.preventDefault();
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;
      const errBox = document.getElementById('login-error');

      if (!isFirebaseInitialized || !auth) {
        errBox.textContent = "Firebase belum dikonfigurasi. Masukkan konfigurasi API Key terlebih dahulu.";
        errBox.classList.remove('hidden');
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showToast('Login admin berhasil!', 'success');
        window.location.hash = '#/admin';
      } catch (err) {
        console.error(err);
        errBox.textContent = "Login gagal. Periksa kembali email dan password Anda.";
        errBox.classList.remove('hidden');
      }
    };

    // ==========================================
    // ROUTER UTAMA
    // ==========================================
    function router() {
      const hash = window.location.hash || '#/';
      const appDiv = document.getElementById('app');
      if (!appDiv) return;

      // Handle submit form di start page
      setTimeout(() => {
        const startForm = document.getElementById('start-form');
        if (startForm) {
          startForm.onsubmit = function(e) {
            e.preventDefault();
            const inputVal = document.getElementById('participant-name').value.trim();
            const errEl = document.getElementById('name-error');
            if (!inputVal) {
              errEl.textContent = "Nama peserta wajib diisi.";
              errEl.classList.remove('hidden');
              return;
            }
            if (inputVal.length > 30) {
              errEl.textContent = "Nama maksimal 30 karakter.";
              errEl.classList.remove('hidden');
              return;
            }
            startNameInput = inputVal;
            const participantId = 'dom_' + Math.random().toString(36).substring(2, 10);
            testParticipant = {
              id: participantId,
              name: inputVal,
              createdAt: Date.now()
            };
            currentTestIndex = 0;
            userAnswers = {};
            window.location.hash = '#/test';
          };
        }
      }, 50);

      if (hash === '#/' || hash === '') {
        appDiv.innerHTML = renderLandingPage();
      } else if (hash === '#/start') {
        appDiv.innerHTML = renderStartPage();
      } else if (hash === '#/test') {
        appDiv.innerHTML = renderTestPage();
      } else if (hash === '#/review') {
        appDiv.innerHTML = renderReviewPage();
      } else if (hash.startsWith('#/result/')) {
        const id = hash.replace('#/result/', '');
        appDiv.innerHTML = renderResultPage(id);
      } else if (hash === '#/admin/login') {
        appDiv.innerHTML = renderAdminLoginPage();
      } else if (hash === '#/admin') {
        appDiv.innerHTML = renderAdminDashboard();
      } else if (hash === '#/admin/participants') {
        appDiv.innerHTML = renderAdminParticipants();
      } else if (hash === '#/admin/statistics') {
        appDiv.innerHTML = renderAdminStatistics();
      } else if (hash === '#/admin/settings') {
        appDiv.innerHTML = renderAdminSettings();
      } else {
        appDiv.innerHTML = renderNotFound();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', router);
  </script>
