<html lang="id" class="scroll-smooth">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: '#000000',
            darkSurface: '#0A0A0A',
            cardSurface: '#121212',
            primaryText: '#FFFFFF',
            secondaryText: '#A3A3A3',
            mutedText: '#737373',
          },
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }

  <style>
    /* Global Styles & Text Glow */
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
      transition: background 0.3s ease;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Cinzel', serif;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.3), 0 0 30px rgba(255, 255, 255, 0.1);
    }

    p, span, label, a {
      transition: text-shadow 0.3s ease, color 0.3s ease;
    }

    p:hover, span:hover {
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
    }

    /* True Glow & Floating Animation untuk logo.png */
    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes pulseGlow {
      0%, 100% {
        filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.4)) drop-shadow(0 0 40px rgba(255, 255, 255, 0.15));
      }
      50% {
        filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.75)) drop-shadow(0 0 60px rgba(255, 255, 255, 0.35));
      }
    }

    .logo-glow-anim {
      animation: floatLogo 4s ease-in-out infinite, pulseGlow 3s ease-in-out infinite;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), filter 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .logo-glow-anim:hover {
      transform: scale(1.06) translateY(-4px);
      filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.95)) drop-shadow(0 0 80px rgba(255, 255, 255, 0.5));
    }

    /* Card Glow & Hover Transition */
    .glow-box {
      background: #121212;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.03), inset 0 0 15px rgba(255, 255, 255, 0.01);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glow-box:hover {
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.12), inset 0 0 20px rgba(255, 255, 255, 0.03);
      transform: translateY(-3px);
    }

    /* Button Glow & Active Transitions */
    .glow-btn {
      background: #FFFFFF;
      color: #000000;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glow-btn:hover {
      background: #E5E5E5;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.65);
      transform: translateY(-2px) scale(1.01);
    }

    .glow-btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .glow-btn-outline {
      background: transparent;
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glow-btn-outline:hover {
      border-color: #FFFFFF;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    /* Smooth Fade In */
    .fade-in {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #404040;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-obsidian text-primaryText antialiased">

  <!-- App Root Container -->
  <div id="app" class="flex-1 flex flex-col fade-in"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Script Aplikasi Lengkap -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Konfigurasi Firebase (Sesuaikan jika diperlukan)
    const firebaseConfig = {
      apiKey: "ISI_API_KEY_FIREBASE",
      authDomain: "ISI_AUTH_DOMAIN_FIREBASE",
      databaseURL: "https://blds-flame-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "ISI_PROJECT_ID_FIREBASE",
      storageBucket: "ISI_STORAGE_BUCKET_FIREBASE",
      messagingSenderId: "ISI_MESSAGING_SENDER_ID_FIREBASE",
      appId: "ISI_APP_ID_FIREBASE"
    };

    let app = null, db = null, auth = null, isFirebaseInitialized = false;
    try {
      if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "ISI_API_KEY_FIREBASE") {
        app = initializeApp(firebaseConfig);
        db = getDatabase(app);
        auth = getAuth(app);
        isFirebaseInitialized = true;
      }
    } catch (e) {
      console.warn("Firebase running in local demo mode:", e);
    }

    // Katalog 24 Trait Resmi
    const TRAITS_CATALOG = [
      { id: 'vision', nameEn: 'VISION', nameId: 'Penglihatan dan Arah', category: 'flame', pairId: 'pair_01', description: 'Kemampuan melihat tujuan jangka panjang, memahami gambaran besar, menyusun arah, dan merencanakan langkah.' },
      { id: 'blindness', nameEn: 'BLINDNESS', nameId: 'Kebutaan Arah', category: 'shadow', pairId: 'pair_01', description: 'Kecenderungan terpaku pada satu sudut pandang dan mengabaikan konteks atau petunjuk lain.' },
      { id: 'discipline', nameEn: 'DISCIPLINE', nameId: 'Disiplin', category: 'flame', pairId: 'pair_02', description: 'Kecenderungan menjaga komitmen, mengatur waktu, bertanggung jawab, dan konsisten menjalankan langkah.' },
      { id: 'indiscipline', nameEn: 'INDISCIPLINE', nameId: 'Ketidakteraturan', category: 'shadow', pairId: 'pair_02', description: 'Kecenderungan terdistraksi, menunda, atau kesulitan menjaga konsistensi rutinitas.' },
      { id: 'loyalty', nameEn: 'LOYALTY', nameId: 'Kesetiaan', category: 'flame', pairId: 'pair_03', description: 'Kecenderungan menjaga kepercayaan, komitmen, dan hubungan yang dianggap penting secara bertanggung jawab.' },
      { id: 'betrayal', nameEn: 'BETRAYAL', nameId: 'Pengkhianatan', category: 'shadow', pairId: 'pair_03', description: 'Kecenderungan mengabaikan kepercayaan atau komitmen demi keuntungan sesaat.' },
      { id: 'ambition', nameEn: 'AMBITION', nameId: 'Ambisi', category: 'flame', pairId: 'pair_04', description: 'Dorongan untuk berkembang, menetapkan tujuan, mempelajari keterampilan, dan meningkatkan kemampuan.' },
      { id: 'arrogance', nameEn: 'ARROGANCE', nameId: 'Keangkuhan', category: 'shadow', pairId: 'pair_04', description: 'Kecenderungan merasa paling benar, meremehkan masukan, atau menolak kritik.' },
      { id: 'resilience', nameEn: 'RESILIENCE', nameId: 'Ketangguhan', category: 'flame', pairId: 'pair_05', description: 'Kecenderungan beradaptasi, belajar dari hambatan, dan mencoba melanjutkan langkah secara sehat.' },
      { id: 'despair', nameEn: 'DESPAIR', nameId: 'Keputusasaan', category: 'shadow', pairId: 'pair_05', description: 'Kecenderungan sulit melihat jalan keluar atau merasa berat menghadapi hambatan.' },
      { id: 'hope', nameEn: 'HOPE', nameId: 'Harapan', category: 'flame', pairId: 'pair_06', description: 'Kecenderungan melihat peluang perbaikan dan membayangkan hasil yang lebih baik dengan realistis.' },
      { id: 'hopelessness', nameEn: 'HOPELESSNESS', nameId: 'Kehilangan Harapan', category: 'shadow', pairId: 'pair_06', description: 'Kecenderungan sulit membayangkan perubahan atau hasil yang lebih baik saat menghadapi keadaan berat.' },
      { id: 'awareness', nameEn: 'AWARENESS', nameId: 'Kesadaran', category: 'flame', pairId: 'pair_07', description: 'Kepekaan terhadap situasi, emosi diri, konsekuensi tindakan, dan perspektif orang lain.' },
      { id: 'unawareness', nameEn: 'UNAWARENESS', nameId: 'Kurang Menyadari Keadaan', category: 'shadow', pairId: 'pair_07', description: 'Kecenderungan melewatkan petunjuk penting, konteks, atau dampak perilaku sendiri.' },
      { id: 'patience', nameEn: 'PATIENCE', nameId: 'Kesabaran', category: 'flame', pairId: 'pair_08', description: 'Kemampuan memberi waktu pada proses, menahan dorongan terburu-buru, dan menghadapi ketidakpastian.' },
      { id: 'impatience', nameEn: 'IMPATIENCE', nameId: 'Ketidaksabaran', category: 'shadow', pairId: 'pair_08', description: 'Kecenderungan menuntut hasil segera, cepat frustrasi saat proses lambat, atau memutuskan terlalu cepat.' },
      { id: 'courage', nameEn: 'COURAGE', nameId: 'Keberanian', category: 'flame', pairId: 'pair_09', description: 'Kesediaan menghadapi tantangan, menyampaikan hal penting, dan bertindak meskipun ada rasa takut.' },
      { id: 'cowardice', nameEn: 'COWARDICE', nameId: 'Sikap Menghindar karena Takut', category: 'shadow', pairId: 'pair_09', description: 'Kecenderungan menghindari tantangan atau tanggung jawab karena rasa takut.' },
      { id: 'unity', nameEn: 'UNITY', nameId: 'Persatuan', category: 'flame', pairId: 'pair_10', description: 'Kemampuan bekerja sama, menghargai perbedaan, membangun rasa memiliki, dan mencari tujuan bersama.' },
      { id: 'division', nameEn: 'DIVISION', nameId: 'Perpecahan', category: 'shadow', pairId: 'pair_10', description: 'Kecenderungan memperbesar perbedaan, membentuk kubu, atau mengutamakan konflik.' },
      { id: 'compassion', nameEn: 'COMPASSION', nameId: 'Belas Kasih', category: 'flame', pairId: 'pair_11', description: 'Kemampuan memahami kesulitan orang lain, merespons dengan kepedulian, dan membantu dengan batasan.' },
      { id: 'cruelty', nameEn: 'CRUELTY', nameId: 'Kekejaman', category: 'shadow', pairId: 'pair_11', description: 'Kecenderungan mengabaikan penderitaan atau perasaan orang lain tanpa kepedulian.' },
      { id: 'integrity', nameEn: 'INTEGRITY', nameId: 'Integritas', category: 'flame', pairId: 'pair_12', description: 'Keselarasan antara nilai, perkataan, dan tindakan; kejujuran; serta tanggung jawab atas keputusan.' },
      { id: 'corruption', nameEn: 'CORRUPTION', nameId: 'Kerusakan Integritas', category: 'shadow', pairId: 'pair_12', description: 'Kecenderungan mengorbankan prinsip demi keuntungan atau memanipulasi kepercayaan.' }
    ];

    const FLAMES_LIST = TRAITS_CATALOG.filter(t => t.category === 'flame');
    const SHADOWS_LIST = TRAITS_CATALOG.filter(t => t.category === 'shadow');

    // 30 Pertanyaan Situasional
    const QUESTIONS_LIST = Array.from({ length: 30 }, (_, i) => ({
      id: i + 1,
      text: `Pertanyaan Situasional Refleksi #${i + 1}: Bagaimana Dominioner menyikapi dinamika arah, prioritas, dan tanggung jawab dalam situasi ini?`,
      options: [
        { id: 'A', text: "Mengambil sudut pandang jangka panjang dan menyusun rencana terstruktur.", scores: { vision: 3, discipline: 2 } },
        { id: 'B', text: "Menjaga konsistensi pelaksanaan tugas dan kedisiplinan harian secara teguh.", scores: { discipline: 3, resilience: 2 } },
        { id: 'C', text: "Membangun komunikasi kolaboratif serta menghargai peran orang lain.", scores: { unity: 3, compassion: 2 } },
        { id: 'D', text: "Bertindak secara impulsif atau menghindari tantangan demi kenyamanan sesaat.", scores: { impatience: 2, cowardice: 2, indiscipline: 1 } }
      ]
    }));

    function calculateScores(answers) {
      const rawScores = {};
      TRAITS_CATALOG.forEach(t => { rawScores[t.id] = 0; });
      QUESTIONS_LIST.forEach(q => {
        const optId = answers[q.id];
        if (optId) {
          const opt = q.options.find(o => o.id === optId);
          if (opt && opt.scores) {
            Object.entries(opt.scores).forEach(([traitId, w]) => {
              if (rawScores[traitId] !== undefined) rawScores[traitId] += w;
            });
          }
        }
      });
      const percentages = {};
      TRAITS_CATALOG.forEach(t => {
        const raw = rawScores[t.id] || 0;
        percentages[t.id] = Math.min(100, Math.max(0, Math.round((raw / 30) * 100)));
      });
      return { rawScores, percentages };
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-3 rounded-xl border text-xs font-medium shadow-2xl backdrop-blur-md transition-all duration-300 transform translate-y-2 opacity-0 ${
        type === 'success' ? 'bg-black border-white/40 text-white shadow-[0_0_20px_rgba(255,255,255,0.2)]' : 'bg-black border-red-500/50 text-red-400'
      }`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    // Komponen Logo dengan file logo.png & True Glow Animasi
    function renderLogo(sizeClass = 'w-11 h-11') {
      return `
        <div class="relative ${sizeClass} flex items-center justify-center">
          <img src="logo.png" alt="BLDS Logo" class="w-full h-full object-contain logo-glow-anim" onerror="this.onerror=null; this.src='./public/logo.png';" />
        </div>
      `;
    }

    function renderFooter() {
      return `
        <footer class="w-full bg-black border-t border-white/20 py-12 px-6 mt-auto">
          <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-8 text-center md:text-left">
            <div>
              <div class="flex items-center justify-center md:justify-start gap-2 mb-2">
                <span class="text-white font-cinzel font-bold tracking-widest text-sm" style="text-shadow: 0 0 10px rgba(255,255,255,0.5);">BLACKLIGHTDOMINIONS</span>
                <span class="text-mutedText">•</span>
                <span class="text-secondaryText font-semibold text-xs">BLDS FLAMES</span>
              </div>
              <p class="text-[11px] text-mutedText max-w-md">
                A BLACKLIGHTDOMINIONS Experience. Tes refleksi kepribadian fiktif untuk Dominioners. Bukan tes psikologi tervalidasi atau diagnosis medis.
              </p>
              <p class="text-[10px] text-mutedText mt-1">© 2026 BLACKLIGHTDOMINIONS. All rights reserved.</p>
            </div>

            <div class="flex flex-col sm:flex-row items-center gap-4">
              <a href="https://chat.whatsapp.com/LYhSQn3vXhO6qpVWyoJEoR?s=cl&p=a&ilr=1" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-black border border-white/30 text-white text-xs font-medium hover:bg-white/10 hover:border-white transition-all shadow-[0_0_15px_rgba(255,255,255,0.05)]">
                <span>WA Community</span>
              </a>
              <a href="https://discord.gg/r4dM4QFteV" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-black border border-white/30 text-white text-xs font-medium hover:bg-white/10 hover:border-white transition-all shadow-[0_0_15px_rgba(255,255,255,0.05)]">
                <span>Discord Community</span>
              </a>
            </div>
          </div>
        </footer>
      `;
    }

    function renderNavbar() {
      return `
        <header class="w-full border-b border-white/20 bg-black/95 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex items-center justify-between transition-all duration-300">
          <a href="#/" class="flex items-center gap-3 group">
            ${renderLogo('w-10 h-10')}
            <div>
              <span class="font-cinzel font-bold tracking-widest text-white text-sm block" style="text-shadow: 0 0 12px rgba(255,255,255,0.6);">BLDS FLAMES</span>
              <span class="text-[9px] text-mutedText tracking-wider uppercase block">Blacklightdominions</span>
            </div>
          </a>
          <div class="flex items-center gap-4">
            <a href="#/start" class="px-5 py-2.5 rounded-xl glow-btn font-cinzel text-xs font-bold tracking-wider">Mulai Tes</a>
            <a href="#/admin/login" class="text-xs text-mutedText hover:text-white transition-colors px-2 py-1">Admin</a>
          </div>
        </header>
      `;
    }

    // Landing Page
    function renderLandingPage() {
      return `
        ${renderNavbar()}
        <main class="flex-1 flex flex-col items-center fade-in">
          <section class="w-full max-w-5xl mx-auto px-6 py-24 text-center flex flex-col items-center">
            <div class="mb-6">${renderLogo('w-32 h-32')}</div>
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 border border-white/20 text-white text-xs font-medium mb-6 shadow-[0_0_15px_rgba(255,255,255,0.08)]">
              <span>BLACKLIGHTDOMINIONS • Mystical Personality Archive</span>
            </div>
            <h1 class="text-4xl md:text-6xl font-cinzel font-bold tracking-tight text-white mb-6" style="text-shadow: 0 0 25px rgba(255,255,255,0.7);">
              Discover the Flames Within
            </h1>
            <p class="text-base md:text-lg text-secondaryText max-w-2xl mb-12 leading-relaxed">
              Masuki arsip rahasia BLACKLIGHTDOMINIONS. Temukan refleksi kepribadian mendalam melalui 12 Flames dan 12 Shadow Flames dalam estetika monokromatik murni.
            </p>
            <a href="#/start" class="px-8 py-4 rounded-xl glow-btn font-cinzel font-bold text-sm tracking-wider flex items-center gap-3">
              <span>Mulai Tes Sekarang</span>
            </a>
          </section>

          <section class="w-full max-w-6xl mx-auto px-6 py-16 border-t border-white/15">
            <div class="text-center mb-12">
              <h2 class="text-2xl font-cinzel font-bold text-white mb-2">Dimensi Refleksi Diri</h2>
              <p class="text-xs text-mutedText tracking-wider uppercase">12 Pasangan Sifat Utama • Hitam & Putih Abadi</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              ${FLAMES_LIST.slice(0, 6).map(flame => {
                const shadow = SHADOWS_LIST.find(s => s.pairId === flame.pairId);
                return `
                  <div class="glow-box rounded-2xl p-6 flex flex-col justify-between">
                    <div>
                      <div class="flex items-center justify-between mb-3">
                        <span class="text-xs font-cinzel font-bold text-white tracking-widest uppercase">${escapeHTML(flame.nameEn)}</span>
                        <span class="w-2.5 h-2.5 rounded-full bg-white shadow-[0_0_10px_rgba(255,255,255,0.9)]"></span>
                      </div>
                      <h3 class="text-sm font-semibold text-white mb-2">${escapeHTML(flame.nameId)}</h3>
                      <p class="text-xs text-secondaryText mb-4 line-clamp-3">${escapeHTML(flame.description)}</p>
                    </div>
                    ${shadow ? `<div class="pt-3 border-t border-white/10 text-[11px] text-mutedText"><span class="text-white font-medium">Shadow:</span> ${escapeHTML(shadow.nameId)}</div>` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        </main>
        ${renderFooter()}
      `;
    }

    // Start Page
    let startNameInput = '';
    function renderStartPage() {
      return `
        ${renderNavbar()}
        <main class="flex-1 flex flex-col items-center justify-center px-6 py-16 fade-in">
          <div class="w-full max-w-md glow-box rounded-3xl p-8 flex flex-col items-center text-center">
            <div class="mb-6">${renderLogo('w-24 h-24')}</div>
            <h1 class="text-2xl font-cinzel font-bold text-white mb-2">Identifikasi Dominioner</h1>
            <p class="text-xs text-secondaryText mb-8">Masukkan nama atau panggilanmu untuk memulai perjalanan refleksi kepribadian BLDS FLAMES.</p>
            <form id="start-form" class="w-full space-y-5 text-left">
              <div>
                <label class="block text-xs font-medium text-mutedText mb-2 uppercase tracking-wider">Nama / Panggilan</label>
                <input type="text" id="participant-name" value="${escapeHTML(startNameInput)}" placeholder="Contoh: Daren Akito" maxlength="30" class="w-full bg-obsidian border border-white/20 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-white transition-all shadow-[inset_0_0_10px_rgba(255,255,255,0.02)]" />
                <p id="name-error" class="text-xs text-red-400 mt-1.5 hidden"></p>
              </div>
              <button type="submit" class="w-full py-4 rounded-xl glow-btn font-cinzel font-bold text-xs tracking-wider flex items-center justify-center gap-2">Mulai 30 Pertanyaan</button>
            </form>
          </div>
        </main>
        ${renderFooter()}
      `;
    }

    // Test Page
    let currentTestIndex = 0;
    let userAnswers = {};
    let testParticipant = null;

    function renderTestPage() {
      if (!testParticipant) { window.location.hash = '#/start'; return ''; }
      const currentQ = QUESTIONS_LIST[currentTestIndex];
      const totalQ = QUESTIONS_LIST.length;
      const progressPct = ((currentTestIndex + 1) / totalQ) * 100;
      const selectedOpt = userAnswers[currentQ.id];

      return `
        ${renderNavbar()}
        <main class="flex-1 flex flex-col items-center justify-center px-6 py-12 max-w-3xl mx-auto w-full fade-in">
          <div class="w-full mb-8">
            <div class="flex justify-between items-center text-xs text-mutedText mb-2">
              <span class="font-semibold text-white font-cinzel">Pertanyaan ${currentTestIndex + 1} dari ${totalQ}</span>
              <span>${Math.round(progressPct)}% Selesai</span>
            </div>
            <div class="w-full h-2 bg-darkSurface rounded-full overflow-hidden border border-white/20">
              <div class="h-full bg-white transition-all duration-300 shadow-[0_0_10px_rgba(255,255,255,0.8)]" style="width: ${progressPct}%"></div>
            </div>
          </div>
          <div class="w-full glow-box rounded-3xl p-8 mb-8">
            <h2 class="text-lg md:text-xl font-cinzel font-semibold text-white mb-6 leading-relaxed">${escapeHTML(currentQ.text)}</h2>
            <div class="space-y-3.5">
              ${currentQ.options.map(opt => {
                const isSelected = selectedOpt === opt.id;
                return `
                  <button onclick="window.selectTestOption(${currentQ.id}, '${opt.id}')" class="w-full text-left p-4 rounded-xl border transition-all duration-300 flex items-start gap-4 ${isSelected ? 'bg-white text-black border-white shadow-[0_0_20px_rgba(255,255,255,0.4)] font-medium scale-[1.01]' : 'bg-obsidian border-white/15 text-secondaryText hover:border-white/50 hover:text-white'}">
                    <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold shrink-0 border ${isSelected ? 'bg-black text-white border-black' : 'border-white/30 text-white'}">${opt.id}</span>
                    <span class="text-sm pt-0.5">${escapeHTML(opt.text)}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
          <div class="w-full flex items-center justify-between">
            <button onclick="window.prevTestQuestion()" ${currentTestIndex === 0 ? 'disabled' : ''} class="px-6 py-3 rounded-xl border text-xs font-semibold flex items-center gap-2 transition-all ${currentTestIndex === 0 ? 'opacity-30 border-white/10 text-mutedText cursor-not-allowed' : 'glow-btn-outline'}">Sebelumnya</button>
            ${currentTestIndex < totalQ - 1 ? `
              <button onclick="window.nextTestQuestion()" ${!selectedOpt ? 'disabled' : ''} class="px-8 py-3 rounded-xl text-xs font-cinzel font-bold flex items-center gap-2 transition-all ${!selectedOpt ? 'bg-white/10 text-mutedText cursor-not-allowed' : 'glow-btn'}">Lanjut</button>
            ` : `
              <button onclick="window.goToReview()" ${!selectedOpt ? 'disabled' : ''} class="px-8 py-3.5 rounded-xl text-xs font-cinzel font-bold flex items-center gap-2 transition-all ${!selectedOpt ? 'bg-white/10 text-mutedText cursor-not-allowed' : 'glow-btn'}">Review & Selesai</button>
            `}
          </div>
        </main>
        ${renderFooter()}
      `;
    }

    window.selectTestOption = (qId, optId) => { userAnswers[qId] = optId; document.getElementById('app').innerHTML = renderTestPage(); };
    window.nextTestQuestion = () => { if (currentTestIndex < QUESTIONS_LIST.length - 1) { currentTestIndex++; window.scrollTo({top:0, behavior:'smooth'}); document.getElementById('app').innerHTML = renderTestPage(); } };
    window.prevTestQuestion = () => { if (currentTestIndex > 0) { currentTestIndex--; window.scrollTo({top:0, behavior:'smooth'}); document.getElementById('app').innerHTML = renderTestPage(); } };
    window.goToReview = () => { window.location.hash = '#/review'; };

    // Review Page
    function renderReviewPage() {
      if (!testParticipant) { window.location.hash = '#/start'; return ''; }
      const answeredCount = Object.keys(userAnswers).length;
      const isComplete = answeredCount === QUESTIONS_LIST.length;
      return `
        ${renderNavbar()}
        <main class="flex-1 flex flex-col items-center px-6 py-12 max-w-3xl mx-auto w-full fade-in">
          <div class="w-full glow-box rounded-3xl p-8 mb-8 text-center">
            <h1 class="text-2xl font-cinzel font-bold text-white mb-2">Review Jawaban Dominioner</h1>
            <p class="text-xs text-secondaryText">Pastikan seluruh 30 pertanyaan telah terjawab sebelum menghitung profil.</p>
            <div class="mt-4 inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 border border-white/35 text-xs font-semibold text-white">Terjawab: ${answeredCount} dari 30</div>
          </div>
          <div class="w-full space-y-4 mb-8">
            ${QUESTIONS_LIST.map((q, idx) => {
              const ans = userAnswers[q.id];
              return `
                <div class="glow-box rounded-2xl p-5 flex items-center justify-between gap-4">
                  <div>
                    <span class="text-[10px] text-mutedText uppercase tracking-wider block mb-1">Soal ${idx + 1}</span>
                    <p class="text-xs text-white font-medium line-clamp-1">${escapeHTML(q.text)}</p>
                  </div>
                  <div class="flex items-center gap-3 shrink-0">
                    <span class="px-3 py-1 rounded-lg text-xs font-bold ${ans ? 'bg-white/20 text-white border border-white/40' : 'bg-red-500/20 text-red-400 border border-red-500/40'}">${ans ? `Opsi ${ans}` : 'Belum'}</span>
                    <button onclick="window.jumpToQuestion(${idx})" class="text-xs text-white underline hover:text-secondaryText transition-colors">Ubah</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          <div class="w-full flex items-center justify-between">
            <a href="#/test" class="px-6 py-3 rounded-xl glow-btn-outline text-xs font-semibold transition-all">Kembali ke Tes</a>
            <button onclick="window.submitTestResult()" ${!isComplete ? 'disabled' : ''} class="px-8 py-3.5 rounded-xl text-xs font-cinzel font-bold flex items-center gap-2 transition-all ${!isComplete ? 'bg-white/10 text-mutedText cursor-not-allowed' : 'glow-btn'}">Hitung & Lihat Profil</button>
          </div>
        </main>
        ${renderFooter()}
      `;
    }

    window.jumpToQuestion = (idx) => { currentTestIndex = idx; window.location.hash = '#/test'; };
    window.submitTestResult = async () => {
      if (!testParticipant) return;
      const { rawScores, percentages } = calculateScores(userAnswers);
      const resultId = 'res_' + Math.random().toString(36).substring(2, 12);
      const participantResult = { id: resultId, participantId: testParticipant.id, name: testParticipant.name, createdAt: testParticipant.createdAt, completedAt: Date.now(), status: 'completed', answers: userAnswers, rawScores, percentages };
      localStorage.setItem(`blds_result_${resultId}`, JSON.stringify(participantResult));
      if (isFirebaseInitialized && db) {
        try { await set(ref(db, `participants/${resultId}`), participantResult); } catch (e) { console.error(e); }
      }
      showToast('Profil berhasil dihitung dan disimpan!', 'success');
      window.location.hash = `#/result/${resultId}`;
    };

    // Result Page
    function renderResultPage(resultId) {
      const local = localStorage.getItem(`blds_result_${resultId}`);
      const resultData = local ? JSON.parse(local) : null;
      return `
        ${renderNavbar()}
        <main class="flex-1 flex flex-col items-center px-6 py-12 max-w-5xl mx-auto w-full fade-in">
          ${!resultData ? `<div class="w-full glow-box rounded-3xl p-12 text-center"><h1 class="text-2xl font-cinzel font-bold text-white mb-2">Memuat Arsip...</h1></div>` : `
            <div class="w-full glow-box rounded-3xl p-8 text-center mb-10">
              <div class="mb-6 flex justify-center">${renderLogo('w-24 h-24')}</div>
              <span class="text-xs text-white font-cinzel tracking-widest uppercase block mb-1">Arsip Profil Resmi • BLDS FLAMES</span>
              <h1 class="text-3xl md:text-4xl font-cinzel font-bold text-white mb-3">${escapeHTML(resultData.name)}</h1>
              <p class="text-xs text-mutedText">Diselesaikan pada ${new Date(resultData.completedAt).toLocaleDateString('id-ID', { dateStyle: 'full' })}</p>
              <div class="flex flex-wrap items-center justify-center gap-4 mt-6">
                <button onclick="window.copyResultSummary('${resultId}')" class="px-6 py-3 rounded-xl glow-btn font-cinzel font-bold text-xs tracking-wider">Salin Ringkasan Profil</button>
                <a href="#/" class="px-6 py-3 rounded-xl glow-btn-outline text-xs font-semibold">Kembali ke Beranda</a>
              </div>
            </div>
            <div class="w-full mb-12">
              <h2 class="text-xl font-cinzel font-bold text-white mb-6 flex items-center gap-3"><span class="w-3 h-3 rounded-full bg-white shadow-[0_0_12px_rgba(255,255,255,0.9)]"></span><span>12 FLAMES (Sisi Konstruktif)</span></h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                ${FLAMES_LIST.map(flame => {
                  const pct = resultData.percentages[flame.id] || 0;
                  return `
                    <div class="glow-box rounded-2xl p-6 flex flex-col justify-between">
                      <div>
                        <div class="flex justify-between items-center mb-2"><span class="text-xs font-cinzel font-bold text-white tracking-widest">${escapeHTML(flame.nameEn)}</span><span class="text-sm font-bold text-white">${pct}%</span></div>
                        <h3 class="text-sm font-semibold text-secondaryText mb-3">${escapeHTML(flame.nameId)}</h3>
                        <div class="w-full h-2 bg-obsidian rounded-full overflow-hidden border border-white/20 mb-3"><div class="h-full bg-white transition-all duration-500 shadow-[0_0_10px_rgba(255,255,255,0.8)]" style="width: ${pct}%"></div></div>
                        <p class="text-xs text-secondaryText leading-relaxed">${escapeHTML(flame.description)}</p>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
            <div class="w-full mb-12">
              <h2 class="text-xl font-cinzel font-bold text-white mb-6 flex items-center gap-3"><span class="w-3 h-3 rounded-full bg-white/40"></span><span>12 SHADOW FLAMES (Sisi Tantangan)</span></h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                ${SHADOWS_LIST.map(shadow => {
                  const pct = resultData.percentages[shadow.id] || 0;
                  return `
                    <div class="glow-box rounded-2xl p-6 flex flex-col justify-between">
                      <div>
                        <div class="flex justify-between items-center mb-2"><span class="text-xs font-cinzel font-bold text-secondaryText tracking-widest">${escapeHTML(shadow.nameEn)}</span><span class="text-sm font-bold text-white">${pct}%</span></div>
                        <h3 class="text-sm font-semibold text-secondaryText mb-3">${escapeHTML(shadow.nameId)}</h3>
                        <div class="w-full h-2 bg-obsidian rounded-full overflow-hidden border border-white/20 mb-3"><div class="h-full bg-white/60 transition-all duration-500" style="width: ${pct}%"></div></div>
                        <p class="text-xs text-secondaryText leading-relaxed">${escapeHTML(shadow.description)}</p>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `}
        </main>
        ${renderFooter()}
      `;
    }

    window.copyResultSummary = (resultId) => {
      const local = localStorage.getItem(`blds_result_${resultId}`);
      if (!local) return;
      const data = JSON.parse(local);
      navigator.clipboard.writeText(`Profil BLDS Flames - ${data.name}\nJelajahi arsip BLACKLIGHTDOMINIONS.`);
      showToast('Ringkasan profil berhasil disalin!', 'success');
    };

    // Admin Login Page & Demo Login Notice
    function renderAdminLoginPage() {
      return `
        ${renderNavbar()}
        <main class="flex-1 flex flex-col items-center justify-center px-6 py-16 fade-in">
          <div class="w-full max-w-md glow-box rounded-3xl p-8 flex flex-col items-center text-center">
            <div class="mb-6">${renderLogo('w-24 h-24')}</div>
            <h1 class="text-2xl font-cinzel font-bold text-white mb-2">Admin Portal</h1>
            <p class="text-xs text-secondaryText mb-6">Autentikasi pengelola arsip BLACKLIGHTDOMINIONS.</p>
            
            <div class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 mb-6 text-left text-xs text-secondaryText">
              <span class="font-semibold text-white block mb-1">💡 Info Akses Admin:</span>
              Gunakan email & password dari Firebase Authentication, atau klik <b>Demo Admin</b> di bawah untuk langsung mencoba dashboard.
            </div>

            <form id="admin-login-form" onsubmit="window.handleAdminLogin(event)" class="w-full space-y-4 text-left">
              <div>
                <label class="block text-xs font-medium text-mutedText mb-2 uppercase tracking-wider">Email Admin</label>
                <input type="email" id="admin-email" value="admin@blds.com" required class="w-full bg-obsidian border border-white/20 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-white" />
              </div>
              <div>
                <label class="block text-xs font-medium text-mutedText mb-2 uppercase tracking-wider">Password</label>
                <input type="password" id="admin-password" value="blds2026" required class="w-full bg-obsidian border border-white/20 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-white" />
              </div>
              <div id="login-error" class="text-xs text-red-400 text-center hidden"></div>
              <button type="submit" class="w-full py-4 rounded-xl glow-btn font-cinzel font-bold text-xs tracking-wider">Masuk Dashboard</button>
              <button type="button" onclick="window.bypassAdminDemo()" class="w-full py-3 rounded-xl glow-btn-outline font-cinzel text-xs font-bold tracking-wider">⚡ Masuk Mode Demo Admin</button>
            </form>
          </div>
        </main>
        ${renderFooter()}
      `;
    }

    let isAdminDemoBypassed = false;
    window.bypassAdminDemo = () => {
      isAdminDemoBypassed = true;
      showToast('Masuk ke Dashboard sebagai Demo Admin!', 'success');
      window.location.hash = '#/admin';
    };

    window.handleAdminLogin = async (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;
      if (isFirebaseInitialized && auth) {
        try {
          await signInWithEmailAndPassword(auth, email, password);
          showToast('Login admin berhasil!', 'success');
          window.location.hash = '#/admin';
          return;
        } catch (err) { console.error(err); }
      }
      // Fallback demo login
      if (email === 'admin@blds.com' && password === 'blds2026') {
        isAdminDemoBypassed = true;
        showToast('Login Admin Demo Berhasil!', 'success');
        window.location.hash = '#/admin';
      } else {
        document.getElementById('login-error').textContent = "Login gagal. Gunakan mode Demo Admin.";
        document.getElementById('login-error').classList.remove('hidden');
      }
    };

    // Admin Dashboard Layout
    function renderAdminLayout(activeTab, contentHtml) {
      return `
        <div class="min-h-screen bg-obsidian text-primaryText flex flex-col md:flex-row fade-in">
          <aside class="w-full md:w-64 bg-cardSurface border-b md:border-b-0 md:border-r border-white/20 flex flex-col">
            <div class="p-6 border-b border-white/10 flex items-center gap-3">
              ${renderLogo('w-10 h-10')}
              <div>
                <h1 class="font-cinzel font-bold text-sm text-white tracking-wider">BLDS ADMIN</h1>
                <p class="text-[10px] text-mutedText">Dominioners Archive</p>
              </div>
            </div>
            <nav class="flex-1 p-4 space-y-1 font-sans">
              <a href="#/admin" class="flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-medium transition-all ${activeTab === 'dashboard' ? 'bg-white text-black font-semibold shadow-[0_0_15px_rgba(255,255,255,0.4)]' : 'text-secondaryText hover:bg-white/5 hover:text-white'}">Dashboard</a>
              <a href="#/admin/participants" class="flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-medium transition-all ${activeTab === 'participants' ? 'bg-white text-black font-semibold shadow-[0_0_15px_rgba(255,255,255,0.4)]' : 'text-secondaryText hover:bg-white/5 hover:text-white'}">Peserta</a>
              <a href="#/admin/statistics" class="flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-medium transition-all ${activeTab === 'statistics' ? 'bg-white text-black font-semibold shadow-[0_0_15px_rgba(255,255,255,0.4)]' : 'text-secondaryText hover:bg-white/5 hover:text-white'}">Statistik</a>
              <a href="#/admin/settings" class="flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-medium transition-all ${activeTab === 'settings' ? 'bg-white text-black font-semibold shadow-[0_0_15px_rgba(255,255,255,0.4)]' : 'text-secondaryText hover:bg-white/5 hover:text-white'}">Pengaturan</a>
            </nav>
            <div class="p-4 border-t border-white/10 space-y-2">
              <a href="#/" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs text-mutedText hover:text-white transition-colors">Kembali ke Beranda</a>
              <button onclick="window.handleAdminLogout()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-xs text-red-400 hover:bg-red-500/10 transition-colors">Keluar</button>
            </div>
          </aside>
          <main class="flex-1 p-6 md:p-10 overflow-y-auto">${contentHtml}</main>
        </div>
      `;
    }

    window.handleAdminLogout = async () => {
      isAdminDemoBypassed = false;
      if (auth) await signOut(auth);
      showToast('Berhasil keluar.', 'success');
      window.location.hash = '#/admin/login';
    };

    function renderAdminDashboard() {
      if (!isAdminDemoBypassed && isFirebaseInitialized && !auth?.currentUser) {
        window.location.hash = '#/admin/login'; return '';
      }
      return renderAdminLayout('dashboard', `
        <div class="space-y-8">
          <div>
            <h1 class="text-2xl font-cinzel font-bold text-white mb-1">Dashboard Overview</h1>
            <p class="text-xs text-mutedText">Statistik dan ringkasan aktivitas peserta BLDS FLAMES.</p>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glow-box rounded-2xl p-6">
              <span class="text-xs text-mutedText uppercase tracking-wider block mb-2">Algoritma Versi</span>
              <p class="text-3xl font-cinzel font-bold text-white">v1.0.0</p>
            </div>
            <div class="glow-box rounded-2xl p-6">
              <span class="text-xs text-mutedText uppercase tracking-wider block mb-2">Bank Soal</span>
              <p class="text-3xl font-cinzel font-bold text-white">30 Soal</p>
            </div>
            <div class="glow-box rounded-2xl p-6">
              <span class="text-xs text-mutedText uppercase tracking-wider block mb-2">Status Database</span>
              <p class="text-sm font-semibold text-white mt-2">${isFirebaseInitialized ? 'Terhubung' : 'Mode Demo'}</p>
            </div>
          </div>
        </div>
      `);
    }

    function renderAdminParticipants() {
      const keys = Object.keys(localStorage).filter(k => k.startsWith('blds_result_'));
      const participants = keys.map(k => JSON.parse(localStorage.getItem(k)));
      return renderAdminLayout('participants', `
        <div class="space-y-6">
          <h1 class="text-2xl font-cinzel font-bold text-white mb-1">Kelola Peserta</h1>
          <div class="glow-box rounded-2xl overflow-hidden">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-white/20 bg-obsidian/40 text-[11px] text-mutedText uppercase tracking-wider font-cinzel">
                  <th class="p-4">Nama</th>
                  <th class="p-4">Tanggal</th>
                  <th class="p-4">Status</th>
                  <th class="p-4 text-right">Aksi</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-white/10 text-xs">
                ${participants.length === 0 ? `<tr><td colspan="4" class="p-6 text-center text-mutedText">Belum ada data peserta tersimpan.</td></tr>` : participants.map(p => `
                  <tr class="hover:bg-white/5 transition-colors">
                    <td class="p-4 font-semibold text-white">${escapeHTML(p.name)}</td>
                    <td class="p-4 text-secondaryText">${new Date(p.completedAt).toLocaleDateString()}</td>
                    <td class="p-4"><span class="px-2.5 py-1 rounded-full text-[10px] bg-white/10 border border-white/30 text-white">${p.status}</span></td>
                    <td class="p-4 text-right"><a href="#/result/${p.id}" class="inline-flex px-3 py-1 rounded-lg bg-white text-black font-medium">Lihat</a></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `);
    }

    function renderAdminStatistics() { return renderAdminLayout('statistics', `<div class="space-y-6"><h1 class="text-2xl font-cinzel font-bold text-white">Statistik Agregat</h1><div class="glow-box rounded-2xl p-8 text-center text-mutedText">Analisis dimensi Flames aktif.</div></div>`); }
    function renderAdminSettings() { return renderAdminLayout('settings', `<div class="space-y-6"><h1 class="text-2xl font-cinzel font-bold text-white">Pengaturan Sistem</h1><div class="glow-box rounded-2xl p-6 space-y-4"><span class="text-xs text-mutedText block uppercase">Database URL: Realtime Database</span></div></div>`); }
    function renderNotFound() { return `${renderNavbar()}<main class="flex-1 flex flex-col items-center justify-center px-6 py-20 text-center"><h1 class="text-3xl font-cinzel font-bold text-white mb-2">404 • Dimensi Tidak Ditemukan</h1><a href="#/" class="px-6 py-3 rounded-xl glow-btn font-cinzel text-xs font-bold">Kembali ke Beranda</a></main>${renderFooter()}`; }

    // Router
    function router() {
      const hash = window.location.hash || '#/';
      const appDiv = document.getElementById('app');
      if (!appDiv) return;

      setTimeout(() => {
        const startForm = document.getElementById('start-form');
        if (startForm) {
          startForm.onsubmit = (e) => {
            e.preventDefault();
            const inputVal = document.getElementById('participant-name').value.trim();
            const errEl = document.getElementById('name-error');
            if (!inputVal) { errEl.textContent = "Nama peserta wajib diisi."; errEl.classList.remove('hidden'); return; }
            startNameInput = inputVal;
            testParticipant = { id: 'dom_' + Math.random().toString(36).substring(2, 10), name: inputVal, createdAt: Date.now() };
            currentTestIndex = 0; userAnswers = {};
            window.location.hash = '#/test';
          };
        }
      }, 50);

      if (hash === '#/' || hash === '') appDiv.innerHTML = renderLandingPage();
      else if (hash === '#/start') appDiv.innerHTML = renderStartPage();
      else if (hash === '#/test') appDiv.innerHTML = renderTestPage();
      else if (hash === '#/review') appDiv.innerHTML = renderReviewPage();
      else if (hash.startsWith('#/result/')) appDiv.innerHTML = renderResultPage(hash.replace('#/result/', ''));
      else if (hash === '#/admin/login') appDiv.innerHTML = renderAdminLoginPage();
      else if (hash === '#/admin') appDiv.innerHTML = renderAdminDashboard();
      else if (hash === '#/admin/participants') appDiv.innerHTML = renderAdminParticipants();
      else if (hash === '#/admin/statistics') appDiv.innerHTML = renderAdminStatistics();
      else if (hash === '#/admin/settings') appDiv.innerHTML = renderAdminSettings();
      else appDiv.innerHTML = renderNotFound();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', router);
  </script>
</body>
</html>
