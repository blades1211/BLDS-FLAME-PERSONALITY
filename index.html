          { id: 'C', text: "Ikatan kepercayaan, cinta, dan dukungan tulus dari orang-orang terdekat di sekitar.", scores: { loyalty: 3, unity: 3, compassion: 2 } },
          { id: 'D', text: "Keinginan untuk melarikan diri dari kenyataan dan menyalahkan takdir semesta.", scores: { despair: 3, hopelessness: 3, cowardice: 3 } }
        ]
      }
    ];

    function calculateScores(answers) {
      const rawScores = {};
      TRAITS_CATALOG.forEach(t => { rawScores[t.id] = 0; });
      const answeredCount = Object.keys(answers).length || 1;
      
      QUESTIONS_LIST.forEach(q => {
        const optId = answers[q.id];
        if (optId) {
          const opt = q.options.find(o => o.id === optId);
          if (opt && opt.scores) {
            Object.entries(opt.scores).forEach(([traitId, w]) => {
              if (rawScores[traitId] !== undefined) rawScores[traitId] += w;
            });
          }
        }
      });

      const percentages = {};
      TRAITS_CATALOG.forEach(t => {
        const raw = rawScores[t.id] || 0;
        // Normalisasi fleksibel berdasarkan jumlah soal yang terjawab agar akurat walau keluar di tengah jalan
        const maxPossible = answeredCount * 3;
        let pct = maxPossible > 0 ? (raw / maxPossible) * 100 : 0;
        percentages[t.id] = Math.min(100, Math.max(0, Math.round(pct)));
      });
      return { rawScores, percentages };
    }

      toast.className = `pointer-events-auto px-4 py-3 rounded-xl border text-xs font-medium shadow-2xl backdrop-blur-md transition-all duration-300 transform translate-y-2 opacity-0 typing-effect ${
        type === 'success' ? 'bg-black border-white/40 text-white shadow-[0_0_20px_rgba(255,255,255,0.2)]' : 'bg-black border-red-500/50 text-red-400'
      }`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `}
        </main>
        ${renderFooter()}
      `;
    }

    window.copyResultSummary = (resultId) => {
      const local = localStorage.getItem(`blds_result_${resultId}`);
      if (!local) return;
      const data = JSON.parse(local);
      navigator.clipboard.writeText(`Profil BLDS Flames - ${data.name}\nJelajahi arsip BLACKLIGHTDOMINIONS.`);
      showToast('Ringkasan profil berhasil disalin!', 'success');
    };

    function renderNotFound() {
      return `${renderNavbar()}<main class="flex-1 flex flex-col items-center justify-center px-6 py-20 text-center"><h1 class="text-3xl font-cinzel font-bold text-white mb-2">404 • Dimensi Tidak Ditemukan</h1><a href="#/" class="px-6 py-3 rounded-xl glow-btn font-cinzel text-xs font-bold">Kembali ke Beranda</a></main>${renderFooter()}`;
    }

    // Router
    function router() {
      const hash = window.location.hash || '#/';
      const appDiv = document.getElementById('app');
      if (!appDiv) return;

      setTimeout(() => {
        const startForm = document.getElementById('start-form');
        if (startForm) {
          startForm.onsubmit = (e) => {
            e.preventDefault();
            const inputVal = document.getElementById('participant-name').value.trim();
            const errEl = document.getElementById('name-error');
            if (!inputVal) { errEl.textContent = "Nama peserta wajib diisi."; errEl.classList.remove('hidden'); return; }
            startNameInput = inputVal;
            testParticipant = { id: 'dom_' + Math.random().toString(36).substring(2, 10), name: inputVal, createdAt: Date.now() };
            currentTestIndex = 0; userAnswers = {};
            window.location.hash = '#/test';
          };
        }
      }, 50);

      if (hash === '#/' || hash === '') appDiv.innerHTML = renderLandingPage();
      else if (hash === '#/start') appDiv.innerHTML = renderStartPage();
      else if (hash === '#/test') appDiv.innerHTML = renderTestPage();
      else if (hash === '#/review') appDiv.innerHTML = renderReviewPage();
      else if (hash.startsWith('#/result/')) appDiv.innerHTML = renderResultPage(hash.replace('#/result/', ''));
      else appDiv.innerHTML = renderNotFound();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', router);
  </script>
</body>
</html>
